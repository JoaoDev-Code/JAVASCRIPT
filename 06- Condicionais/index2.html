<body>


<div class="container">
    <h1>Calculadora de IMC</h1>

    <label>Nome:</label>
    <input type="text" placeholder="Digite seu nome">

    <label>Peso (kg):</label>
    <input type="number" placeholder="Ex.: 70">

    <label>Altura (m):</label>
    <input type="number" step="0.01" placeholder="Ex.: 1.75">

    <button type="button">Calcular IMC</button>

    <div class="resposta">
        A resposta aparecerá aqui.
    </div>
</div>

<script>
    // aqui comeca o codigo
   
   let nome = document.querySelector("input[type='text']");
   let peso = document.querySelectorAll("input[type='number']")[0];
   let altura = document.querySelectorAll("input[type='number']")[1];
   let botao = document.querySelector("button");
   let resposta = document.querySelector(".resposta");

   botao.addEventListener("click" , function() { 

     let nomeUsuario = nome.value;
     let alturaUsuario = Number(altura.value);
     let pesoUsuario = Number(peso.value);


   if (nomeUsuario === "" || pesoUsuario <= 0 || alturaUsuario <= 0) {
        resposta.innerHTML = "Preencha todos os campos corretamente.";
    } else {

        let imc = pesoUsuario / (alturaUsuario * alturaUsuario);

        let classificacao = "";

        if (imc < 18.5) {
            classificacao = "Abaixo do peso normal";
        } else if (imc < 25) {
            classificacao = "Peso normal";
        } else if (imc < 30) {
            classificacao = "Excesso de peso";
        } else if (imc < 35) {
            classificacao = "Obesidade classe I";
        } else if (imc < 40) {
            classificacao = "Obesidade classe II";
        } else {
            classificacao = "Obesidade classe III";
        }

         resposta.innerHTML = `
            Olá, ${nomeUsuario}!<br><br>
            Seu IMC é: ${imc.toFixed(2)}<br>
            Classificação: ${classificacao}
        `;
    }

});
     
</script>

</body>
